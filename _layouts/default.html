<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Sol Nicol</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0a;
      --text: #e5e5e5;
      --text-dim: #888;
      --accent: #fff;
      --border: #222;
      --font-main: 'Geist', sans-serif;
      --font-mono: 'Geist Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 4rem 2rem;
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 4rem;
    }

    h1 {
      font-size: 1rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 2rem;
      color: var(--text-dim);
    }

    .bio {
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.4;
      margin-bottom: 3rem;
      color: var(--text);
    }

    .bio strong {
      font-weight: 500;
      color: var(--accent);
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 3rem 0;
    }

    h3 {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 1.5rem;
      color: var(--text-dim);
    }

    .build-item {
      margin-bottom: 2rem;
    }

    .build-item strong {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    .build-item p {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    ul.links {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .metadata {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 4rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Jekyll content override */
    .content h1, .content h2 { display: none; } /* Hide redundant headers from markdown */
    
    @media (max-width: 480px) {
      body { padding: 3rem 1.5rem; }
      .bio { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="content">
    {{ content }}
  </div>
  
  <div class="metadata">
    © 2026 Sol Nicol • Built in Edinburgh
  </div>
</body>
</html>
